$kind: http-request
description: 'Ready-to-use template for testing new or custom endpoints. Automatically includes Authorization: Bearer {{idToken}} and Content-Type: application/json.'
url: '{{baseUrl}}/'
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{idToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is success (2xx)", function () {
          pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 1000
