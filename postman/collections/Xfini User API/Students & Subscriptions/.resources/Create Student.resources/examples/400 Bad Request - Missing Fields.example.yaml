$kind: http-example
request:
  url: '{{baseUrl}}/create-student'
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "firstName": "Jane"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "All fields are required: firstName, lastName, email, planmonths, role.",
        "code": "INVALID_INPUT"
      }
order: 2000
