$kind: http-example
request:
  url: '{{baseUrl}}/create-student'
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "firstName": "Jane",
        "lastName": "Doe",
        "email": "jane.doe@example.com",
        "role": "student",
        "planmonths": "NON_EXISTENT_PLAN"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "No active plan found with name \"NON_EXISTENT_PLAN\".",
        "code": "PLAN_NOT_FOUND"
      }
order: 3000
