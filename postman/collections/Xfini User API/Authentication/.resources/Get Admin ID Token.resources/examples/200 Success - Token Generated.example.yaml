$kind: http-example
request:
  url: '{{baseUrl}}/api/getToken'
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "idToken": "eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1NiIsInR5cCI6IkpXVCJ9..signature",
        "expiresIn": "3600"
      }
order: 1000
