$kind: http-example
request:
  url: '{{baseUrl}}/api/getToken'
  method: POST
  headers:
    Accept: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "error": "INVALID_LOGIN_CREDENTIALS"
      }
order: 2000
