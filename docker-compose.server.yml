services:
  xfini-user-api:
    build: .
    container_name: xfini-user-api
    ports:
      - '5677:3001'
    environment:
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: ${PORT:-3001}
      TZ: Asia/Kolkata
    volumes:
      - ./serviceAccount.json:/app/serviceAccount.json:ro
      - xfini_stats_data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 1
      start_period: 10s
    restart: unless-stopped

  n8n:
    # Pin the image so a routine container recreation cannot unexpectedly pull a new major version.
    # Set N8N_IMAGE in .env to the exact version you have validated in a test instance.
    image: ${N8N_IMAGE:-n8nio/n8n:2.46.6}
    container_name: n8n
    ports:
      - '5678:5678'
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # Keep the previous 2.x task timeout and Compression node limits for compatibility.
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-300}
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: ${N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES:-2147483648}
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: ${N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES:-5000}
      # Preserves existing unverified community packages. Set to false after confirming
      # every workflow uses verified packages, or keep true only for packages you trust.
      N8N_UNVERIFIED_PACKAGES_ENABLED: ${N8N_UNVERIFIED_PACKAGES_ENABLED:-true}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - xfini-user-api
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 5678 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    command: http --url=${NGROK_DOMAIN} http://n8n:5678
    ports:
      - '4040:4040'
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      n8n:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
  xfini_stats_data:
