services:
  xfini-user-api:
    image: ${DOCKER_IMAGE:-ghcr.io/xfini-academy/xfini-user-api:latest}
    ports:
      - "5677:3001"
    environment:
      FIREBASE_API_KEY: ${FIREBASE_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: ${PORT:-3001}
    volumes:
      - ./serviceAccount.json:/app/serviceAccount.json:ro
      - xfini_stats_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: http --url=${NGROK_DOMAIN} http://n8n:443
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      n8n:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:443"
    environment:
      N8N_HOST: ${NGROK_DOMAIN}
      N8N_PORT: 443
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${NGROK_DOMAIN}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - xfini-user-api
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 443 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  n8n_data:
  xfini_stats_data:
